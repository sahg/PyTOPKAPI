name: topkapi

channels:
  - conda-forge
  - nodefaults        # keep the solve on one channel; strict priority below

dependencies:
  # ---- core Python + scientific stack ----
  - python=3.12
  - numpy>=1.26,<2      # see note 1 — kept <2 so shipped PyTOPKAPI runs for M0
  - scipy>=1.11         # estuary ODE (solve_ivp) + calibration objectives
  - pandas>=2.1         # adapter CSV, calibration alignment, cwqm read_river
  - matplotlib-base>=3.8
  - pyyaml>=6.0         # project.yaml config
  - networkx>=3.2       # REQUIRED — pretreatment.py & create_file.py import it;
                        #   pyproject deps are empty so nothing else pulls it

  # ---- HDF5 forcing files ----
  - h5py>=3.10          # mode= now mandatory — drives the housekeeping fix (4.6)
  - pytables>=3.9       # pytopkapi imports `tables`
  - netcdf4>=1.6        # CHIRPS / GPM IMERG ingest
  - xarray>=2024.3
  - rioxarray>=0.15     # clip gridded rainfall to the model grid

  # ---- geospatial / raster IO ----
  - gdal>=3.8           # osgeo bindings + gdalwarp/gdal_rasterize CLI
  - rasterio>=1.3       # primary raster IO
  - rasterstats>=0.19   # majority / zonal stats: class rasters → grid cells
  - geopandas>=0.14     # SA Land Type / SANLC polygons
  - fiona>=1.9
  - shapely>=2.0
  - pyproj>=3.6         # UTM36S / EPSG:32736
  - scikit-image>=0.22  # pysheds dep — pinned here so pip won't re-pull it

  # ---- Land Type memoir PDFs (M2) ----
  - pdfplumber>=0.11    # parse AGIS Land Type memoir PDFs → soil attribute CSV
  
  # ---- testing ----
  - pytest>=8.0
  - pytest-cov>=4.1

  # ---- exploration (optional; delete this block to slim the env) ----
  - jupyterlab>=4.0
  - ipython>=8.20
  - tqdm>=4.66

  # ---- pip-only: pure-Python, deps already satisfied by conda above ----
  - pip>=24.0
  - pip:
      - pysheds>=0.4    # terrain analysis (4.1); or swap for conda `richdem`
      - spotpy>=1.6     # global optimiser for calibration (4.5)